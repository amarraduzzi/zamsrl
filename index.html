<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ZAM SRL, société immobilière à Genappe depuis 2002. Achat de biens, vente et location de maisons et appartements en Brabant wallon.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<title>ZAM SRL Immobilier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: dark photographic hero with floating search panel (EverGreen), then light editorial sections in ZAM black and gold */
:root{
  --ink:#141312; --ink-2:#1f1d1a; --ink-line:#34302a;
  --paper:#f5f3ee; --paper-2:#ebe7de; --card:#ffffff;
  --gold:#c49a58; --gold-deep:#9c7638; --gold-soft:#e7d3ae;
  --text:#1b1a18; --muted:#6c665c; --on-ink:#f3efe6; --on-ink-muted:#b9b1a2;
  --line:#ddd6c8;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-logo:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --wrap:1180px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;overflow-x:clip;background:var(--paper);color:var(--text);font:16px/1.6 var(--f-body)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep)}
.rule{width:56px;height:2px;background:var(--gold);border:0;margin:0}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--on-ink);border-bottom:1px solid var(--ink-line)}
.nav{display:flex;align-items:center;gap:24px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;flex:none}
.brand svg{width:40px;height:32px}
.brand b{font:700 20px/1 var(--f-logo);letter-spacing:.04em}
.brand b span{color:var(--gold)}
.links{display:flex;gap:clamp(16px,2vw,28px);margin-left:auto;white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.links a{text-decoration:none;color:var(--on-ink-muted);padding-block:6px;border-bottom:2px solid transparent}
.links a:hover,.links a.on{color:var(--gold);border-color:var(--gold)}
.lang{display:flex;border:1px solid var(--ink-line);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font:600 12px/1 var(--f-body);letter-spacing:.08em;padding:7px 10px;border-radius:999px;color:var(--on-ink-muted)}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.cta-top{font-weight:600;font-size:14px;text-decoration:none;background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;white-space:nowrap}
.cta-top:hover{background:var(--gold-soft)}
@media (max-width:1100px){.cta-top{padding:10px 12px;font-size:0;gap:0}.cta-top svg{margin:0!important}}
@media (max-width:900px){.links{display:none}.lang{margin-left:auto}.cta-top{display:none}}

/* Hero: full-bleed photo, slow push-in, masked headline reveal */
header{transition:background .35s ease,border-color .35s ease}
header.over{background:transparent;border-color:transparent}
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--on-ink);margin-top:-73px}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:68% 42%;transform-origin:70% 40%;animation:kb 18s cubic-bezier(.2,.6,.2,1) both}
.hero-bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(20,19,18,.94) 0%,rgba(20,19,18,.78) 34%,rgba(20,19,18,.2) 66%,rgba(20,19,18,.08) 100%),
  linear-gradient(0deg,rgba(20,19,18,.85) 0%,rgba(20,19,18,0) 38%),
  linear-gradient(180deg,rgba(20,19,18,.7) 0%,rgba(20,19,18,0) 24%)}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.hero-inner{position:relative;z-index:2;min-height:clamp(620px,90vh,880px);display:flex;align-items:center;padding-block:150px 190px}
.hero-copy{display:flex;flex-direction:column;gap:22px;max-width:640px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid rgba(243,239,230,.22);color:var(--on-ink);background:rgba(20,19,18,.35);backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(42px,6.2vw,84px);letter-spacing:-.015em;line-height:1.02}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.hero h1 .ln>*{display:inline-block;animation:rise 1.1s cubic-bezier(.2,.75,.15,1) both}
.hero h1 .ln+.ln>*{animation-delay:.14s}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:rgba(243,239,230,.82);max-width:44ch;margin:0}
.hero .chips,.hero p.lead,.hero-cta{animation:fade .9s ease both .45s}
.hero .chips{animation-delay:.05s}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.since{position:absolute;right:clamp(16px,4vw,40px);bottom:150px;z-index:2;background:rgba(20,19,18,.55);backdrop-filter:blur(8px);border:1px solid rgba(243,239,230,.16);border-radius:var(--r);padding:14px 18px;display:grid;gap:2px;animation:fade .9s ease both .7s}
.since b{font:600 28px/1 var(--f-display);color:var(--gold)}
.since span{font-size:13px;color:var(--on-ink-muted)}
@media (max-width:900px){
  .hero-inner{min-height:0;align-items:flex-end;padding-block:clamp(300px,62vw,420px) 48px}
  .hero-bg img{object-position:62% 30%}
  .hero-bg::after{background:linear-gradient(0deg,rgba(20,19,18,1) 0%,rgba(20,19,18,.92) 38%,rgba(20,19,18,.35) 62%,rgba(20,19,18,.55) 100%)}
  .since{top:96px;bottom:auto;right:16px}
}

/* Search panel */
.search{position:relative;z-index:5;margin-top:-104px;background:var(--card);border-radius:20px;box-shadow:0 24px 60px -24px rgba(20,19,18,.45);padding:26px clamp(18px,3vw,32px)}
.search h2{font-size:24px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--text)}
.field select,.field input{font:inherit;font-size:15px;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;min-width:0}
.btn{font:600 15px/1 var(--f-body);cursor:pointer;border:0;border-radius:999px;padding:15px 24px;background:var(--ink);color:var(--on-ink);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--gold-deep)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:var(--gold-soft)}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--muted)}
.quick button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--text)}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
@media (max-width:900px){.fields{grid-template-columns:1fr 1fr}.fields .btn{grid-column:1/-1}.search{margin-top:0}}
@media (max-width:480px){.fields{grid-template-columns:1fr}}

/* Pillars */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-block:56px 0;border-block:1px solid var(--line)}
.pillar{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px 16px}
.pillar+.pillar{border-left:1px solid var(--line)}
.pillar svg{width:40px;height:40px;stroke:var(--gold-deep);fill:none;stroke-width:1.6}
.pillar b{font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.pillar span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.pillars{grid-template-columns:1fr 1fr}.pillar:nth-child(3){border-left:0}.pillar:nth-child(n+3){border-top:1px solid var(--line)}}

section{padding-block:88px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:36px}
.sec-head h2{font-size:clamp(32px,4vw,48px)}
.sec-head p{max-width:46ch;color:var(--muted);margin:0}

/* About */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,5vw,72px);align-items:center}
.about-copy{display:grid;gap:20px}
.about-copy h2{font-size:clamp(32px,4vw,48px)}
.about-copy p{margin:0;color:var(--muted);max-width:52ch}
.benefits{display:grid;gap:14px;margin-top:8px}
.benefit{display:flex;gap:14px;align-items:flex-start}
.benefit svg{flex:none;width:34px;height:34px;stroke:var(--gold-deep);fill:none;stroke-width:1.6}
.benefit b{display:block;font-weight:600}
.benefit span{font-size:14px;color:var(--muted)}
.about-pics{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto auto;gap:14px;position:relative}
.about-pics img{width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.about-pics .a{grid-row:1/3;aspect-ratio:3/4}
.about-pics .b{aspect-ratio:4/3}
.sig{display:grid;align-content:center;gap:4px;background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:20px}
.sig b{font:700 22px/1 var(--f-logo);color:var(--gold)}
.sig span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-ink-muted)}
@media (max-width:900px){.about{grid-template-columns:1fr}}

/* Listings */
.listings{background:var(--paper-2)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid3{grid-template-columns:1fr}}
.prop{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prop figure{margin:0;position:relative;aspect-ratio:4/3;overflow:hidden}
.prop figure img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.prop:hover figure img{transform:scale(1.04)}
.tag{position:absolute;top:12px;left:12px;background:var(--card);color:var(--text);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px}
.tag.demo{left:auto;right:12px;background:var(--ink);color:var(--gold)}
.prop-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.prop-body .view{margin-top:auto}
.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prop h3{font-size:22px}
.loc{font-size:14px;color:var(--muted)}
.price{font:600 20px/1.2 var(--f-body);font-variant-numeric:tabular-nums;color:var(--text)}
.price small{font-weight:500;font-size:13px;color:var(--muted)}
.empty{grid-column:1/-1;background:var(--card);border-radius:var(--r);padding:36px;text-align:center;color:var(--muted)}

/* Sell */
.sell{background:var(--ink);color:var(--on-ink)}
.sell .sec-head p{color:var(--on-ink-muted)}
.sell .eyebrow{color:var(--gold)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--ink-line);border:1px solid var(--ink-line);border-radius:var(--r);overflow:hidden}
.steps li{background:var(--ink-2);padding:28px 24px;display:grid;gap:10px;align-content:start}
.steps .n{font:600 44px/1 var(--f-display);color:var(--gold)}
.steps b{font-size:17px}
.steps span{font-size:14px;color:var(--on-ink-muted)}
.sell-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;align-items:center}
.sell-cta p{margin:0;color:var(--on-ink-muted);font-size:14px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* FAQ */
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,5vw,72px)}
.faq h2{font-size:clamp(32px,4vw,48px)}
.faq-intro{display:grid;gap:16px;align-content:start}
.faq-intro p{margin:0;color:var(--muted)}
details{border-bottom:1px solid var(--line);padding-block:18px}
details:first-child{border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;min-width:0;overflow-wrap:anywhere;justify-content:space-between;gap:16px;font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 24px/1 var(--f-display);color:var(--gold-deep);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:12px 0 0;color:var(--muted);max-width:62ch}
@media (max-width:900px){.faq{grid-template-columns:1fr}}
.faq>div{min-width:0}

/* Contact */
.contact{background:var(--paper-2)}
.contact-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,5vw,64px)}
.info{display:grid;gap:18px;align-content:start}
.info h2{font-size:clamp(32px,4vw,48px)}
.info p{margin:0;color:var(--muted)}
.info dl{margin:0;display:grid;gap:14px}
.info dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:600}
.info dd{margin:2px 0 0;font-size:16px;user-select:all}
form{background:var(--card);border-radius:20px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:1fr 1fr;gap:16px}
form .full{grid-column:1/-1}
form textarea{font:inherit;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:120px;resize:vertical;width:100%}
.ok{grid-column:1/-1;background:var(--paper);border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:14px}
@media (max-width:900px){.contact-grid{grid-template-columns:1fr}}
@media (max-width:520px){form{grid-template-columns:1fr}}

/* Hero CTAs */
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn.line{background:transparent;color:var(--on-ink);border:1px solid var(--ink-line)}
.btn.line:hover{border-color:var(--gold);color:var(--gold);background:transparent}

/* Sell funnel */
.sell-grid{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(24px,4vw,48px);align-items:start}
.sell-grid .steps{grid-template-columns:1fr}
.sell-grid .steps li{grid-template-columns:auto 1fr;column-gap:18px;row-gap:4px;padding:22px}
.sell-grid .steps .n{grid-row:1/3;font-size:36px}
.funnel{background:var(--card);color:var(--text);border-radius:20px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:1fr;gap:20px}
.f-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.f-top b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
.f-top span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.f-bar{height:4px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.f-bar i{display:block;height:100%;width:25%;background:var(--gold);transition:width .35s ease}
.f-step{border:0;margin:0;padding:0;min-width:0;display:grid;gap:14px}
.f-step legend{font:600 26px/1.15 var(--f-display);padding:0;margin-bottom:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:grid;gap:10px;justify-items:start;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .2s,background .2s;height:100%}
.opt span:hover{border-color:var(--gold)}
.opt svg{width:30px;height:30px;stroke:var(--gold-deep);fill:none;stroke-width:1.6}
.opt b{font-weight:600}
.opt input:checked+span{border-color:var(--gold);background:var(--paper);box-shadow:inset 0 0 0 1px var(--gold)}
.opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .opt span{padding:10px 16px;border-radius:999px;display:block;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2 .full{grid-column:1/-1}
.funnel textarea{font:inherit;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:88px;resize:vertical;width:100%}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px;transition:border-color .2s,background .2s}
.drop.over,.drop:hover{border-color:var(--gold);background:var(--paper)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs div{position:relative;width:68px;height:68px}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.thumbs button{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:14px;line-height:22px;text-align:center}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.consent input{accent-color:var(--gold-deep);margin-top:3px;width:16px;height:16px;flex:none}
.f-nav{display:flex;justify-content:space-between;gap:12px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper);color:var(--text)}
.btn[disabled]{opacity:.6;cursor:wait}
.f-err{margin:0;color:#a4332a;font-size:14px}
.f-done{display:grid;gap:14px;justify-items:start}
.f-done .ic{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.f-done .ic svg{width:26px;height:26px;stroke:var(--gold-deep);fill:none;stroke-width:2.2}
.f-done h3{font-size:28px}
.f-done p{margin:0;color:var(--muted);max-width:48ch}
.btn.wa{background:#1f7a4d;color:#fff}
.btn.wa:hover{background:#17603c}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
section,.funnel{scroll-margin-top:88px}
.funnel [aria-invalid="true"]{border-color:#a4332a;box-shadow:0 0 0 1px #a4332a}
.opts:has([aria-invalid="true"]) .opt span{border-color:#a4332a}
.funnel .field label,.funnel .lbl{font-size:13px;font-weight:600}
.f-step[hidden],.f-done[hidden]{display:none!important}
@media (max-width:900px){.sell-grid{grid-template-columns:1fr}.sell-grid .steps{grid-template-columns:1fr 1fr}.sell-grid .steps li{grid-template-columns:1fr}.sell-grid .steps .n{grid-row:auto}}
@media (max-width:520px){.opts,.grid2{grid-template-columns:1fr}.sell-grid .steps{grid-template-columns:1fr}}


/* Mobile action bar: floating capsule */
.mbar{display:none}
@media (max-width:760px){
  .mbar{display:flex;justify-content:center;position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
    padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));transition:transform .3s ease,opacity .3s ease}
  .mbar.off{transform:translateY(120%);opacity:0}
  .mbar .pill{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
    background:rgba(20,19,18,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(196,154,88,.55);box-shadow:0 14px 32px -10px rgba(0,0,0,.6)}
  .mbar a{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f-body);text-decoration:none;border-radius:999px;padding:12px 20px;color:var(--on-ink)}
  .mbar a svg{width:17px;height:17px;flex:none}
  .mbar .call{background:var(--gold);color:var(--ink)}
  .mbar .call:active{background:var(--gold-soft)}
  .mbar .wa svg{color:var(--gold)}
  .mbar .wa:active{background:rgba(255,255,255,.08)}

/* Listing cards: clickable, PEB chip */
.prop{position:relative;transition:box-shadow .3s,transform .3s}
.prop:hover{box-shadow:0 22px 44px -26px rgba(20,19,18,.45);transform:translateY(-2px)}
.prop-open{all:unset;position:absolute;inset:0;z-index:2;cursor:pointer;border-radius:var(--r)}
.prop-open:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.peb-chip{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:8px;padding:4px 8px 4px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.peb-chip b{display:grid;place-items:center;min-width:26px;height:22px;border-radius:5px;color:#fff;font-size:12px;letter-spacing:0;padding-inline:4px}
.view{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:14px;font-weight:600;color:var(--gold-deep)}
.view i{font-style:normal;transition:transform .25s}
.prop:hover .view i{transform:translateX(4px)}
.ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* Estimator */
.estim{background:var(--paper)}
.est-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(20,19,18,.5)}
.est-form{background:var(--card);padding:clamp(22px,3.4vw,40px);display:grid;grid-template-columns:1fr;box-shadow:none;gap:24px;align-content:start;border-radius:0}
.lbl{font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg .opt span{padding:14px 12px;text-align:center;justify-items:center;font-size:14px;font-weight:600;gap:6px}
.seg .opt svg{width:26px;height:26px}
.range-row{display:flex;justify-content:space-between;align-items:baseline}
.range-row output{font:600 22px/1 var(--f-display);color:var(--text);font-variant-numeric:tabular-nums}
.field input[type=range],input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;border:0;padding:0;border-radius:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--pct,30%),var(--line) var(--pct,30%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--gold);margin-top:-10px;box-shadow:0 2px 8px rgba(20,19,18,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--gold)}
.est-out{background:var(--ink);color:var(--on-ink);padding:clamp(22px,3.4vw,40px);display:grid;gap:18px;align-content:start;position:relative}
.est-out .eyebrow{color:var(--gold)}
.est-price{font:600 clamp(34px,4.4vw,52px)/1.05 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:0 .3em;align-items:baseline}
.est-price i{font-style:normal;color:var(--gold);font-size:.7em}
.est-scale{position:relative;height:46px;margin-top:4px}
.est-scale .track{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:6px;background:var(--ink-line)}
.est-scale .band{position:absolute;top:10px;height:14px;border-radius:7px;background:var(--gold);transition:left .45s cubic-bezier(.2,.7,.2,1),width .45s cubic-bezier(.2,.7,.2,1)}
.est-scale .med{position:absolute;top:4px;width:2px;height:26px;background:var(--on-ink);opacity:.7;transform:translateX(-1px);transition:left .45s}
.est-scale .med span{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-ink-muted)}
.est-facts{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ink-line);border:1px solid var(--ink-line);border-radius:12px;overflow:hidden}
.est-facts div{background:var(--ink-2);padding:14px 16px}
.est-facts dt{font-size:12px;color:var(--on-ink-muted)}
.est-facts dd{margin:4px 0 0;font:600 18px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.est-note{margin:0;font-size:14px;color:var(--on-ink-muted);max-width:52ch}
.est-src{margin:0;font-size:12px;color:var(--on-ink-muted);opacity:.8}
.est-price.pulse{animation:pulse .5s ease}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
@media (max-width:900px){.est-grid{grid-template-columns:1fr}}
@media (max-width:420px){.seg{grid-template-columns:1fr 1fr 1fr}.seg .opt span{padding:12px 6px;font-size:13px}}

/* Property detail dialog */
.pd{padding:0;border:0;border-radius:22px;width:min(1120px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);background:var(--card);color:var(--text);overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.pd::backdrop{background:rgba(20,19,18,.72);backdrop-filter:blur(6px)}
.pd[open]{animation:pdIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes pdIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.pd-shell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);height:min(760px,calc(100dvh - 32px))}
.pd-gal{background:var(--ink);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.pd-main{position:relative;min-height:0;overflow:hidden}
.pd-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pd-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(20,19,18,.55);backdrop-filter:blur(6px);color:var(--on-ink);border:1px solid rgba(243,239,230,.2)}
.pd-nav:hover{background:var(--gold);color:var(--ink)}
.pd-nav svg{width:20px;height:20px}
.pd-prev{left:14px}.pd-next{right:14px}
.pd-count{position:absolute;left:14px;bottom:14px;font-size:12px;font-weight:600;background:rgba(20,19,18,.6);color:var(--on-ink);padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pd-thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.pd-thumbs button{all:unset;cursor:pointer;flex:none;width:76px;height:56px;border-radius:8px;overflow:hidden;opacity:.55;outline:2px solid transparent;outline-offset:-2px;transition:opacity .2s}
.pd-thumbs button[aria-current="true"]{opacity:1;outline-color:var(--gold)}
.pd-thumbs img{width:100%;height:100%;object-fit:cover}
.pd-info{padding:clamp(22px,3vw,34px);display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;overflow-y:auto;min-height:0}
.pd-x{all:unset;cursor:pointer;position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--text);box-shadow:0 4px 14px rgba(20,19,18,.25)}
.pd-x svg{width:18px;height:18px}
.pd-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-tags .t{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--paper-2)}
.pd-tags .t.demo{background:var(--ink);color:var(--gold)}
.pd h2{font-size:clamp(28px,3vw,36px)}
.pd .loc{margin-top:-8px}
.pd-price{font:600 28px/1 var(--f-body);font-variant-numeric:tabular-nums}
.pd-price small{font-size:14px;font-weight:500;color:var(--muted)}
.pd-facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pd-facts li{flex:1 1 30%;min-width:110px;padding:12px 14px;display:grid;gap:2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.pd-facts span{font-size:12px;color:var(--muted)}
.pd-facts b{font-size:16px;font-variant-numeric:tabular-nums}
.peb{display:grid;gap:8px}
.peb-scale{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;align-items:end}
.peb-scale span{height:22px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;opacity:.35}
.peb-scale span.on{height:32px;opacity:1;font-size:14px;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.peb small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pd-desc{margin:0;color:var(--muted)}
.pd-feat{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pd-feat li{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.pd-cta{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.btn.outline{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.outline:hover{border-color:var(--text);background:transparent;color:var(--text)}
body.lock{overflow:hidden}
@media (max-width:860px){
  .pd{width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  .pd-shell{grid-template-columns:1fr;grid-template-rows:auto auto;height:100dvh;overflow-y:auto}
  .pd-info{overflow:visible;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .pd-main{aspect-ratio:4/3}
  .pd-x{top:calc(12px + env(safe-area-inset-top,0px))}
}

footer{background:var(--ink);color:var(--on-ink-muted);font-size:14px;padding-block:36px}
.foot{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}

.legal{display:flex;flex-wrap:wrap;gap:8px 20px}
.motto{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
</style>

/* Sell funnel */
const F=$("funnel"),STEPS=[...F.querySelectorAll(".f-step")];let step=1,files=[];
function showStep(){
  const t=T[lang],done=step>4;
  STEPS.forEach(s=>s.hidden=+s.dataset.step!==step);
  $("f-done").hidden=!done;$("f-nav").hidden=done;$("f-err").hidden=true;
  F.querySelector(".f-bar").hidden=done;$("f-count").hidden=done;
  $("f-bar").style.width=Math.min(step,4)*25+"%";
  $("f-count").textContent=fill(t.stepOf,Math.min(step,4));
  $("f-back").style.visibility=step>1?"visible":"hidden";
  $("f-next").textContent=step===4?t.submit:t.next;
  if(done)renderDone();
}
function invalid(els,msg){
  els.forEach(el=>el.setAttribute("aria-invalid","true"));
  const err=$("f-err");err.textContent=msg||T[lang].errReq;err.hidden=false;
  (els[0]&&els[0].focus)&&els[0].focus();return false;
}
function validate(){
  F.querySelectorAll("[aria-invalid]").forEach(el=>el.removeAttribute("aria-invalid"));
  const t=T[lang];
  if(step===1){if(!F.querySelector("[name=ptype]:checked"))return invalid([$("pt-house")]);}
  if(step===2){
    const bad=[$("v-city"),$("v-zip")].filter(el=>!el.value.trim());
    if(bad.length)return invalid(bad);
    if(!/^\d{4}$/.test($("v-zip").value.trim()))return invalid([$("v-zip")],t.errZip);
  }
  if(step===4){
    const bad=[$("v-name"),$("v-tel")].filter(el=>!el.value.trim());
    if(!$("v-ok").checked)bad.push($("v-ok"));
    if($("v-mail").value&&!$("v-mail").checkValidity())bad.push($("v-mail"));
    if(bad.length)return invalid(bad);
  }
  return true;
}
function label(name){const c=F.querySelector(`[name=${name}]:checked`);return c?c.nextElementSibling.textContent.trim():""}
function waMessage(){
  const t=T[lang],v=id=>$(id).value.trim();
  const rows=[
    [t.fType,label("ptype")],
    [t.fCity,[v("v-zip"),v("v-city")].filter(Boolean).join(" ")],
    [t.vM2,v("v-m2")],[t.vBeds,v("v-beds")],[t.vState,label("pstate")],
    [t.vNote,v("v-note")],
    estUsed&&estLast?[t.estLine,fmt(estLast.lo)+" – "+fmt(estLast.hi)]:null,[t.cName,v("v-name")],[t.dPhone,v("v-tel")],["E-mail",v("v-mail")]
  ].filter(r=>r&&r[1]).map(r=>"• "+r[0]+" : "+r[1]);
  return [t.waIntro,"",...rows,files.length?"\n"+fill(t.waPhotos,files.length):""].join("\n").trim();
}
function renderDone(){
  const t=T[lang];

}
function go(n){
  step=n;showStep();
  const top=F.getBoundingClientRect().top;
  if(top<0||top>innerHeight*.6)F.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  const first=step<=4&&STEPS[step-1].querySelector("input:not([type=file]),select,textarea");
  if(first&&step>1)first.focus({preventScroll:true});
}
F.addEventListener("submit",e=>{
  e.preventDefault();if(!validate())return;

 ["Genappe","1470",365000,285000],["La Hulpe","1310",535000,null],["Lasne","1380",798000,null],["Nivelles","1400",370000,215000],
 ["Ottignies-Louvain-la-Neuve","1340",420000,244000],["Rixensart","1330",475000,300000],["Tubize","1480",303000,217500],
 ["Villers-la-Ville","1495",385000,null],["Waterloo","1410",583000,381000],["Wavre","1300",421000,255000]
];
const BW=["","",403000,266000];
const STATE={new:1.12,good:1,refresh:.9,renovate:.76};
const r5=n=>Math.round(n/5000)*5000;

function estInit(){
  const sel=$("e-city"),cur=sel.value||"Genappe";
  sel.innerHTML=CITIES.map(c=>`<option value="${c[0]}">${c[0]} (${c[1]})</option>`).join("")+`<option value="">${T[lang].otherCity}</option>`;
  sel.value=cur;

function estCalc(anim=true){
  const type=document.querySelector("[name=etype]:checked").value,st=document.querySelector("[name=estate]:checked").value;
  const c=CITIES.find(x=>x[0]===$("e-city").value)||BW;
  const m2=+$("e-m2").value,house=c[2],apt=c[3]||Math.round(house*.66);
  const base=type==="apt"?apt:type==="villa"?house*1.22:house, typ=type==="apt"?90:type==="villa"?200:160;
  const mid=base*Math.pow(m2/typ,.78)*STATE[st];
  const lo=r5(mid*.93),hi=r5(mid*1.07),med=type==="apt"?apt:house;
  $("e-low").textContent=fmt(lo);$("e-high").textContent=fmt(hi);
  $("e-pm2").textContent=fmt(Math.round(mid/m2/10)*10)+"/m²";
  $("e-med").textContent=fmt(r5(med));
  $("e-m2-out").textContent=m2+" m²";
  $("e-m2").style.setProperty("--pct",((m2-40)/(360))*100+"%");
  const min=med*.35,max=med*2.4,pos=v=>Math.max(0,Math.min(100,(v-min)/(max-min)*100));
  $("e-band").style.left=pos(lo)+"%";$("e-band").style.width=Math.max(2,pos(hi)-pos(lo))+"%";
  $("e-medmark").style.left=pos(med)+"%";
  if(anim){const e=$("e-price");e.classList.remove("pulse");void e.offsetWidth;e.classList.add("pulse")}
  estLast={type,st,city:c[0],zip:c[1],m2,lo,hi};
}

}
function addFiles(list){
  [...list].filter(f=>f.type.startsWith("image/")).slice(0,12-files.length).forEach(file=>files.push({file,url:URL.createObjectURL(file)}));
  drawThumbs();
}
$("v-files").addEventListener("change",e=>{addFiles(e.target.files);e.target.value=""});
const drop=$("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove("over")));
drop.addEventListener("drop",e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
let start="fr";const h=location.hash.replace("#","");
if(T[h])start=h;else{try{const s=localStorage.getItem("zam-lang");if(T[s])start=s}catch(e){}}
setLang(start);
loadProps().then(()=>{render();const m=location.hash.match(/^#bien-([\w-]+)$/);if(m)pdOpen(m[1])});
</script>
